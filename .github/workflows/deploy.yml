name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 檢出原始碼 (Checkout repository)
        uses: actions/checkout@v4

      - name: 設定 Node.js 環境 (Setup Node.js)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 安裝專案依賴 (Install dependencies)
        run: npm ci || npm install --legacy-peer-deps

      - name: 打包靜態網站 (Build static site)
        run: npm run build

      - name: 部署至 gh-pages 分支 (Deploy to gh-pages branch)
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: dist
        continue-on-error: true

      - name: 上傳 Pages 產物 (Upload Pages artifact)
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: 發布至 GitHub Pages (Deploy to Pages)
        id: deployment
        uses: actions/deploy-pages@v4
